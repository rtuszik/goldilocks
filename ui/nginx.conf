# nginx config template
# __GOLDILOCKS_API_URL__ is replaced at container start by entrypoint.sh
# with the value of the GOLDILOCKS_API_URL environment variable.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the goldilocks backend.
    # The SPA uses relative paths (/api/namespaces, /api/{ns}), which nginx
    # forwards to the configured backend, keeping everything same-origin.
    location /api/ {
        proxy_pass __GOLDILOCKS_API_URL__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Health check endpoint for container orchestrators
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Compact access log format
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;
}
