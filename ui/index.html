<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldilocks — VPA Recommendations</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #eef2ff;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --danger: #ef4444;
  --danger-light: #fee2e2;
  --bg: #f1f5f9;
  --card: #ffffff;
  --sidebar-bg: #0f172a;
  --sidebar-hover: rgba(255,255,255,0.07);
  --sidebar-active-bg: rgba(99,102,241,0.2);
  --sidebar-active-border: #6366f1;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --bar-track: #e2e8f0;
  --radius: 8px;
  --sidebar-width: 220px;
  --topbar-height: 56px;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}

/* ─── Layout ─────────────────────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }

#sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  color: #94a3b8;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.topbar {
  height: var(--topbar-height);
  flex-shrink: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 1.25rem;
  gap: 0.75rem;
}

#content {
  flex: 1;
  overflow-y: auto;
  padding: 1.25rem;
}

/* ─── Sidebar ────────────────────────────────────────────────────────────── */
.sidebar-header {
  padding: 1rem 1rem 0.875rem;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 1rem;
  font-weight: 700;
  color: #f1f5f9;
  text-decoration: none;
  user-select: none;
}

.sidebar-nav { flex: 1; padding: 0.5rem 0; }

.nav-section-title {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #475569;
  padding: 0.75rem 1rem 0.4rem;
}

.ns-item {
  display: flex;
  align-items: center;
  padding: 0.45rem 1rem;
  cursor: pointer;
  transition: background 0.12s;
  gap: 0.5rem;
  font-size: 0.825rem;
  border-left: 3px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ns-item:hover { background: var(--sidebar-hover); color: #f1f5f9; }

.ns-item.active {
  background: var(--sidebar-active-bg);
  border-left-color: var(--sidebar-active-border);
  color: #f1f5f9;
}

.ns-icon { flex-shrink: 0; opacity: 0.6; }
.ns-item.active .ns-icon { opacity: 1; }

.sidebar-footer {
  padding: 0.875rem 1rem;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 0.7rem;
  color: #475569;
}

/* ─── Topbar ─────────────────────────────────────────────────────────────── */
.topbar-title { font-weight: 600; font-size: 0.95rem; }
.topbar-spacer { flex: 1; }

#filter-input {
  padding: 0.375rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.85rem;
  width: 200px;
  outline: none;
  transition: border-color 0.15s;
  background: var(--bg);
}
#filter-input:focus { border-color: var(--primary); background: white; }

.btn {
  padding: 0.375rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  cursor: pointer;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }

/* ─── Stats bar ──────────────────────────────────────────────────────────── */
.stats-bar {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.625rem 1rem;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  white-space: nowrap;
}

.stat-value { font-size: 1.375rem; font-weight: 700; line-height: 1; }
.stat-label { font-size: 0.75rem; color: var(--text-muted); }
.stat-card.s-over .stat-value { color: var(--danger); }
.stat-card.s-under .stat-value { color: var(--warning); }
.stat-card.s-optimal .stat-value { color: var(--success); }

/* ─── Workload cards ─────────────────────────────────────────────────────── */
.workloads-grid { display: flex; flex-direction: column; gap: 0.875rem; }

.workload-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.workload-header {
  padding: 0.6rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.625rem;
  border-bottom: 1px solid var(--border);
  background: #fafbfc;
}

.workload-name { font-weight: 600; font-size: 0.9rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workload-count { font-size: 0.72rem; color: #94a3b8; }

/* ─── Type badge ─────────────────────────────────────────────────────────── */
.type-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0.2rem 0.45rem;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  flex-shrink: 0;
}
.tb-Deployment   { background: #ede9fe; color: #7c3aed; }
.tb-StatefulSet  { background: #fef3c7; color: #92400e; }
.tb-DaemonSet    { background: #d1fae5; color: #065f46; }
.tb-ReplicaSet   { background: #dbeafe; color: #1e40af; }
.tb-Job          { background: #fce7f3; color: #9d174d; }
.tb-CronJob      { background: #fce7f3; color: #9d174d; }
.tb-default      { background: #f3f4f6; color: #374151; }

/* ─── Container section ──────────────────────────────────────────────────── */
.container-section { border-bottom: 1px solid var(--border); }
.container-section:last-child { border-bottom: none; }

.container-header {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.625rem 1rem 0.375rem;
}

.container-name {
  font-size: 0.8rem;
  font-weight: 600;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ─── Status badge ───────────────────────────────────────────────────────── */
.status-badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 0.18rem 0.5rem;
  border-radius: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-badge.over    { background: var(--danger-light);  color: #dc2626; }
.status-badge.under   { background: var(--warning-light); color: #d97706; }
.status-badge.optimal { background: var(--success-light); color: #059669; }
.status-badge.unknown { background: #f3f4f6; color: #6b7280; }

/* ─── Resource bars ──────────────────────────────────────────────────────── */
.resource-bars { padding: 0.125rem 1rem 0.625rem; display: flex; flex-direction: column; gap: 0.5rem; }

.resource-row {
  display: grid;
  grid-template-columns: 36px 1fr 152px;
  align-items: center;
  gap: 0.625rem;
}

.resource-label {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.resource-bar-track {
  height: 7px;
  background: var(--bar-track);
  border-radius: 4px;
  position: relative;
  overflow: visible;
}

.resource-bar-fill {
  height: 100%;
  border-radius: 4px;
  position: absolute;
  left: 0;
  top: 0;
  transition: width 0.35s ease;
  max-width: 100%;
}
.resource-bar-fill.optimal { background: var(--success); }
.resource-bar-fill.over    { background: var(--danger); }
.resource-bar-fill.under   { background: var(--warning); }
.resource-bar-fill.unknown { background: #cbd5e1; }

.resource-bar-marker {
  width: 2px;
  height: 13px;
  position: absolute;
  top: -3px;
  background: var(--primary);
  border-radius: 1px;
  transform: translateX(-50%);
  pointer-events: none;
}

.resource-values {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.resource-values .rv-current { color: var(--text); font-weight: 500; }
.resource-values .rv-arrow   { color: #cbd5e1; }
.resource-values .rv-target  { color: var(--primary); font-weight: 500; }

/* ─── YAML section ───────────────────────────────────────────────────────── */
.yaml-actions {
  padding: 0 1rem 0.75rem;
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.yaml-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.25rem 0.55rem;
  font-size: 0.72rem;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.3rem;
  transition: all 0.12s;
  font-family: inherit;
}
.yaml-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.yaml-btn.open  { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

.yaml-panel {
  display: none;
  padding: 0 1rem 0.875rem;
}
.yaml-panel.visible { display: block; }

.yaml-code-wrap { position: relative; }

.yaml-pre {
  background: #1e293b;
  color: #e2e8f0;
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  font-size: 0.78rem;
  line-height: 1.65;
  overflow-x: auto;
  white-space: pre;
}

.yaml-copy {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #94a3b8;
  border-radius: 4px;
  padding: 0.2rem 0.5rem;
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.12s;
  font-family: inherit;
}
.yaml-copy:hover { background: rgba(255,255,255,0.18); color: #f1f5f9; }
.yaml-copy.copied { background: var(--success); border-color: var(--success); color: white; }

/* ─── Loading / Empty / Error ────────────────────────────────────────────── */
.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 200px;
  gap: 0.75rem;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  color: var(--text-muted);
  gap: 0.5rem;
}
.empty-state h3 { color: var(--text); font-size: 1rem; }

.error-box {
  background: var(--danger-light);
  border: 1px solid #fecaca;
  border-radius: var(--radius);
  padding: 0.875rem 1.125rem;
  color: #b91c1c;
  font-size: 0.85rem;
}

/* ─── Scrollbar ──────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* ─── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  #sidebar { width: 180px; }
  .resource-row { grid-template-columns: 32px 1fr 120px; }
  .resource-values { font-size: 0.68rem; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Goldilocks
      </span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Namespaces">
      <div class="loading-wrap" style="height:100px">
        <div class="spinner"></div>
      </div>
    </nav>
    <div class="sidebar-footer">VPA Recommendations v2</div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Goldilocks</div>
      <div class="topbar-spacer"></div>
      <input type="search" id="filter-input" placeholder="Filter workloads…" aria-label="Filter workloads">
      <button class="btn" id="refresh-btn" title="Reload data">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
    </header>

    <main id="content" aria-live="polite">
      <div class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 9h6M9 12h4"/>
        </svg>
        <h3>Select a namespace</h3>
        <p>Choose a namespace from the sidebar to view VPA recommendations.</p>
      </div>
    </main>
  </div>
</div>

<script>
'use strict';

const BASE_PATH = "{{BASE_PATH}}";

// ─── Global YAML store (avoids embedding large strings in onclick attrs) ─────
const _yaml = {};

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  namespaces: [],
  selected: null,
  data: null,   // namespace-level object: { Namespace, Workloads }
  loading: false,
  filter: '',
};

// ─── API helpers ──────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const res = await fetch(BASE_PATH + path);
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
  return res.json();
}

async function loadNamespaces() {
  try {
    state.namespaces = await apiFetch('api/namespaces');
  } catch (e) {
    document.getElementById('sidebar-nav').innerHTML =
      `<div style="padding:1rem;color:#ef4444;font-size:0.78rem">Failed to load namespaces:<br>${esc(e.message)}</div>`;
    return;
  }
  renderSidebar();
}

async function loadNamespace(ns) {
  state.selected = ns;
  state.data = null;
  state.loading = true;
  renderSidebar();
  renderContent();

  try {
    const json = await apiFetch('api/' + encodeURIComponent(ns));
    // The API returns { Namespaces: { [ns]: { Namespace, Workloads } } }
    state.data = (json.Namespaces && json.Namespaces[ns]) ? json.Namespaces[ns] : json;
    state.loading = false;
    renderContent();
  } catch (e) {
    state.loading = false;
    document.getElementById('content').innerHTML =
      `<div class="error-box">Failed to load data for <strong>${esc(ns)}</strong>: ${esc(e.message)}</div>`;
  }
}

// ─── Resource quantity parsing ────────────────────────────────────────────────
function parseCPU(qty) {
  if (!qty || typeof qty !== 'string') return 0;
  qty = qty.trim();
  if (qty.endsWith('m')) return parseInt(qty, 10) || 0;
  if (qty.endsWith('n')) return (parseInt(qty, 10) || 0) / 1e6;
  if (qty.endsWith('u')) return (parseInt(qty, 10) || 0) / 1e3;
  const n = parseFloat(qty);
  return isNaN(n) ? 0 : Math.round(n * 1000);
}

function parseMemory(qty) {
  if (!qty || typeof qty !== 'string') return 0;
  qty = qty.trim();
  const suffixes = {
    Ki: 1024, Mi: 1024**2, Gi: 1024**3, Ti: 1024**4,
    K: 1e3,  M: 1e6,     G: 1e9,     T: 1e12,
  };
  for (const [s, m] of Object.entries(suffixes)) {
    if (qty.endsWith(s)) {
      const n = parseFloat(qty);
      return isNaN(n) ? 0 : n * m;
    }
  }
  return parseInt(qty, 10) || 0;
}

function formatCPU(mc) {
  if (!mc || mc <= 0) return '—';
  if (mc < 1000) return Math.round(mc) + 'm';
  const cores = mc / 1000;
  return cores % 1 === 0 ? cores.toString() : cores.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}

function formatMemory(b) {
  if (!b || b <= 0) return '—';
  if (b >= 1024**3) {
    const v = b / 1024**3;
    return (v % 1 === 0 ? v : v.toFixed(1).replace(/\.0$/, '')) + 'Gi';
  }
  if (b >= 1024**2) return Math.round(b / 1024**2) + 'Mi';
  if (b >= 1024)    return Math.round(b / 1024) + 'Ki';
  return b + 'B';
}

// ─── Status calculation ───────────────────────────────────────────────────────
// Returns 'over' | 'under' | 'optimal' | 'unknown'
function resourceStatus(current, lower, upper) {
  if (upper <= 0) return 'unknown';
  if (current <= 0) return lower > 0 ? 'under' : 'unknown';
  if (current < lower * 0.75) return 'under';
  if (current > upper * 1.5)  return 'over';
  return 'optimal';
}

function containerStatus(c) {
  const cpuS = resourceStatus(
    parseCPU(c.Requests?.cpu),
    parseCPU(c.LowerBound?.cpu),
    parseCPU(c.UpperBound?.cpu)
  );
  const memS = resourceStatus(
    parseMemory(c.Requests?.memory),
    parseMemory(c.LowerBound?.memory),
    parseMemory(c.UpperBound?.memory)
  );
  // worst wins: over > under > optimal > unknown
  const rank = { over: 3, under: 2, optimal: 1, unknown: 0 };
  return rank[cpuS] >= rank[memS] ? cpuS : memS;
}

const STATUS_LABEL = {
  over:    '▼ Over-provisioned',
  under:   '▲ Under-provisioned',
  optimal: '✓ Optimal',
  unknown: '? No data',
};

// ─── YAML builders ────────────────────────────────────────────────────────────
function guaranteedYAML(c) {
  const cpu = c.Target?.cpu    ?? '—';
  const mem = c.Target?.memory ?? '—';
  return [
    'resources:',
    '  requests:',
    `    cpu: "${cpu}"`,
    `    memory: "${mem}"`,
    '  limits:',
    `    cpu: "${cpu}"`,
    `    memory: "${mem}"`,
  ].join('\n');
}

function burstableYAML(c) {
  return [
    'resources:',
    '  requests:',
    `    cpu: "${c.LowerBound?.cpu    ?? '—'}"`,
    `    memory: "${c.LowerBound?.memory ?? '—'}"`,
    '  limits:',
    `    cpu: "${c.UpperBound?.cpu    ?? '—'}"`,
    `    memory: "${c.UpperBound?.memory ?? '—'}"`,
  ].join('\n');
}

// ─── HTML escaping ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ─── Resource bar ─────────────────────────────────────────────────────────────
function barHTML(label, current, lower, upper, target, limits) {
  const fmt = label === 'CPU' ? formatCPU : formatMemory;
  const max  = Math.max(limits, upper, current) * 1.15 || (target * 2) || 1;

  const status  = resourceStatus(current, lower, upper);
  const fillPct = Math.min(current / max * 100, 100).toFixed(1);
  const tgtPct  = target > 0 ? Math.min(target / max * 100, 100).toFixed(1) : null;

  const marker = tgtPct
    ? `<div class="resource-bar-marker" style="left:${tgtPct}%" title="Target: ${fmt(target)}"></div>`
    : '';

  const fill = current > 0
    ? `<div class="resource-bar-fill ${status}" style="width:${fillPct}%"></div>`
    : `<div class="resource-bar-fill unknown" style="width:0%"></div>`;

  return `
    <div class="resource-row">
      <span class="resource-label">${label}</span>
      <div class="resource-bar-track">${fill}${marker}</div>
      <div class="resource-values">
        <span class="rv-current">${esc(fmt(current))}</span>
        <span class="rv-arrow">→</span>
        <span class="rv-target">${esc(fmt(target))}</span>
      </div>
    </div>`;
}

// ─── Container ────────────────────────────────────────────────────────────────
function containerHTML(name, c) {
  const status = containerStatus(c);

  const cpuReq  = parseCPU(c.Requests?.cpu);
  const cpuLow  = parseCPU(c.LowerBound?.cpu);
  const cpuHigh = parseCPU(c.UpperBound?.cpu);
  const cpuTgt  = parseCPU(c.Target?.cpu);
  const cpuLim  = parseCPU(c.Limits?.cpu);

  const memReq  = parseMemory(c.Requests?.memory);
  const memLow  = parseMemory(c.LowerBound?.memory);
  const memHigh = parseMemory(c.UpperBound?.memory);
  const memTgt  = parseMemory(c.Target?.memory);
  const memLim  = parseMemory(c.Limits?.memory);

  // Store YAML in global map to avoid attribute-escaping issues
  const uid = Math.random().toString(36).slice(2, 10);
  const gKey = 'g' + uid;
  const bKey = 'b' + uid;
  _yaml[gKey] = guaranteedYAML(c);
  _yaml[bKey] = burstableYAML(c);

  return `
    <div class="container-section">
      <div class="container-header">
        <span class="container-name" title="${esc(name)}">${esc(name)}</span>
        <span class="status-badge ${status}">${STATUS_LABEL[status]}</span>
      </div>
      <div class="resource-bars">
        ${barHTML('CPU', cpuReq, cpuLow, cpuHigh, cpuTgt, cpuLim)}
        ${barHTML('MEM', memReq, memLow, memHigh, memTgt, memLim)}
      </div>
      <div class="yaml-actions">
        <button class="yaml-btn" onclick="toggleYAML('panel-${gKey}', this)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Guaranteed YAML
        </button>
        <button class="yaml-btn" onclick="toggleYAML('panel-${bKey}', this)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Burstable YAML
        </button>
      </div>
      <div id="panel-${gKey}" class="yaml-panel">
        <div class="yaml-code-wrap">
          <pre class="yaml-pre">${esc(_yaml[gKey])}</pre>
          <button class="yaml-copy" onclick="copyYAML(this, '${gKey}')">Copy</button>
        </div>
      </div>
      <div id="panel-${bKey}" class="yaml-panel">
        <div class="yaml-code-wrap">
          <pre class="yaml-pre">${esc(_yaml[bKey])}</pre>
          <button class="yaml-copy" onclick="copyYAML(this, '${bKey}')">Copy</button>
        </div>
      </div>
    </div>`;
}

// ─── Workload card ────────────────────────────────────────────────────────────
function typeBadgeClass(t) {
  return ['Deployment','StatefulSet','DaemonSet','ReplicaSet','Job','CronJob'].includes(t)
    ? 'tb-' + t : 'tb-default';
}

function workloadHTML(name, w) {
  const containers = w.Containers ?? {};
  const cNames = Object.keys(containers).sort();

  const containersHTML = cNames.map(cn => containerHTML(cn, containers[cn])).join('');

  return `
    <div class="workload-card">
      <div class="workload-header">
        <span class="workload-name" title="${esc(name)}">${esc(name)}</span>
        <span class="type-badge ${typeBadgeClass(w.ControllerType)}">${esc(w.ControllerType || 'Unknown')}</span>
        <span class="workload-count">${cNames.length} container${cNames.length !== 1 ? 's' : ''}</span>
      </div>
      <div>${containersHTML}</div>
    </div>`;
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function statsHTML(workloads) {
  let total = 0, over = 0, under = 0, optimal = 0;
  for (const w of Object.values(workloads)) {
    for (const c of Object.values(w.Containers ?? {})) {
      total++;
      const s = containerStatus(c);
      if (s === 'over') over++;
      else if (s === 'under') under++;
      else if (s === 'optimal') optimal++;
    }
  }
  return `
    <div class="stats-bar">
      <div class="stat-card"><span class="stat-value">${total}</span><span class="stat-label">Containers</span></div>
      <div class="stat-card s-over"><span class="stat-value">${over}</span><span class="stat-label">Over-provisioned</span></div>
      <div class="stat-card s-under"><span class="stat-value">${under}</span><span class="stat-label">Under-provisioned</span></div>
      <div class="stat-card s-optimal"><span class="stat-value">${optimal}</span><span class="stat-label">Optimal</span></div>
    </div>`;
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');

  if (!state.namespaces.length) {
    nav.innerHTML = `<div style="padding:1rem;color:#64748b;font-size:0.78rem">
      No namespaces found.<br>
      <span style="color:#475569">Label a namespace with<br><code style="font-size:0.72rem">goldilocks.fairwinds.com/enabled=true</code></span>
    </div>`;
    return;
  }

  const icon = `<svg class="ns-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M9 10h6M9 14h4"/></svg>`;

  nav.innerHTML = `
    <div class="nav-section-title">Namespaces</div>
    ${state.namespaces.map(ns => `
      <div class="ns-item${ns === state.selected ? ' active' : ''}"
           onclick="selectNS('${esc(ns)}')"
           title="${esc(ns)}"
           role="button"
           aria-current="${ns === state.selected ? 'page' : 'false'}">
        ${icon}${esc(ns)}
      </div>`).join('')}`;
}

// ─── Main content ─────────────────────────────────────────────────────────────
function renderContent() {
  const content = document.getElementById('content');
  const title   = document.getElementById('topbar-title');

  if (!state.selected) {
    title.textContent = 'Goldilocks';
    content.innerHTML = `
      <div class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h4"/>
        </svg>
        <h3>Select a namespace</h3>
        <p>Choose a namespace from the sidebar to view VPA recommendations.</p>
      </div>`;
    return;
  }

  title.textContent = state.selected;

  if (state.loading) {
    content.innerHTML = `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <span>Loading ${esc(state.selected)}…</span>
      </div>`;
    return;
  }

  if (!state.data) return;

  const workloads = state.data.Workloads ?? {};
  const all = Object.keys(workloads).sort();
  const filtered = state.filter
    ? all.filter(n => n.toLowerCase().includes(state.filter.toLowerCase()))
    : all;

  if (!all.length) {
    content.innerHTML = `
      <div class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg>
        <h3>No workloads found</h3>
        <p>No VPA-enabled workloads in <strong>${esc(state.selected)}</strong>.<br>
           Make sure VPAs exist and recommendations have been generated.</p>
      </div>`;
    return;
  }

  let html = statsHTML(workloads);

  if (!filtered.length) {
    html += `<div class="empty-state" style="padding:2rem">
      <p>No workloads match "<strong>${esc(state.filter)}</strong>"</p>
    </div>`;
  } else {
    html += `<div class="workloads-grid">`;
    for (const n of filtered) html += workloadHTML(n, workloads[n]);
    html += `</div>`;
  }

  content.innerHTML = html;
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function selectNS(ns) {
  if (ns !== state.selected) loadNamespace(ns);
}

function toggleYAML(panelId, btn) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const open = panel.classList.toggle('visible');
  btn.classList.toggle('open', open);
}

function copyYAML(btn, key) {
  const text = _yaml[key] ?? '';
  const doFallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  };

  const onSuccess = () => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  };

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => { doFallback(); onSuccess(); });
  } else {
    doFallback();
    onSuccess();
  }
}

document.getElementById('filter-input').addEventListener('input', e => {
  state.filter = e.target.value;
  renderContent();
});

document.getElementById('refresh-btn').addEventListener('click', () => {
  if (state.selected) loadNamespace(state.selected);
  else loadNamespaces();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadNamespaces();
</script>
</body>
</html>
