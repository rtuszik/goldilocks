stages:
    - test
    - release
    - publish

variables:
    REGISTRY_HOST: "registry.r10k.io"
    INITIAL_SEMVER_TAG: "v0.1.0"
    IMAGE_REPO: "registry.r10k.io/rtuszik/goldilocks-ui"
    IMAGE_BRANCH: "${IMAGE_REPO}:main"

default:
    interruptible: true

ui-build:
    stage: test
    image: oven/bun:1-alpine
    script:
        - bun install --frozen-lockfile
        - bun run build
    cache:
        key: "${CI_COMMIT_REF_SLUG}"
        paths:
            - node_modules/

.kaniko-publish:
    stage: publish
    image:
        name: gcr.io/kaniko-project/executor:v1.23.2-debug
        entrypoint: [""]
    before_script:
        - mkdir -p /kaniko/.docker
        - export REGISTRY_USERNAME="${CI_REGISTRY_USER:-$REGISTRY_USER}"
        - export REGISTRY_PASSWORD="${CI_REGISTRY_PASSWORD:-$REGISTRY_PASSWORD}"
        - |
            cat > /kaniko/.docker/config.json <<EOF
            {
              "auths": {
                "${REGISTRY_HOST}": {
                  "username": "${REGISTRY_USERNAME}",
                  "password": "${REGISTRY_PASSWORD}"
                }
              }
            }
            EOF
    script:
        - |
            EXTRA_DESTINATION_ARGS=""
            if [ -n "${DESTINATION_VERSION}" ]; then
              EXTRA_DESTINATION_ARGS="--destination ${DESTINATION_VERSION}"
            fi
            if [ -n "${DESTINATION_LATEST}" ]; then
              EXTRA_DESTINATION_ARGS="${EXTRA_DESTINATION_ARGS} --destination ${DESTINATION_LATEST}"
            fi
            /kaniko/executor \
              --context "${CI_PROJECT_DIR}" \
              --dockerfile "${DOCKERFILE}" \
              --destination "${DESTINATION_BRANCH}" \
              ${EXTRA_DESTINATION_ARGS} \
              --snapshot-mode=redo \
              --cache=false
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

create-release:
    stage: release
    image: alpine:3.23
    resource_group: release-semver
    before_script:
        - apk add --no-cache git curl
    script:
        - git fetch --tags --force
        - |
            EXISTING_TAG="$(git tag --points-at "${CI_COMMIT_SHA}" -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname | tail -n 1)"
            if [ -n "${EXISTING_TAG}" ]; then
              NEXT_TAG="${EXISTING_TAG}"
            else
              LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname | tail -n 1)"
              if [ -z "${LATEST_TAG}" ]; then
                LATEST_TAG="${INITIAL_SEMVER_TAG}"
              fi
              VERSION="${LATEST_TAG#v}"
              MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
              MINOR="$(echo "${VERSION}" | cut -d. -f2)"
              PATCH="$(echo "${VERSION}" | cut -d. -f3)"
              NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            RELEASE_VERSION="${NEXT_TAG}"
            echo "RELEASE_VERSION=${NEXT_TAG}" > release.env
        - |
            if ! curl --silent --show-error --fail \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${RELEASE_VERSION}" >/dev/null; then
              curl --silent --show-error --fail \
                --request POST \
                --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"Release ${RELEASE_VERSION}\",\"tag_name\":\"${RELEASE_VERSION}\",\"description\":\"Automated release for ${CI_COMMIT_SHA}\",\"ref\":\"${CI_COMMIT_SHA}\"}" \
                "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
            fi
    artifacts:
        reports:
            dotenv: release.env
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

publish-image:
    extends: .kaniko-publish
    variables:
        DOCKERFILE: "${CI_PROJECT_DIR}/ui/Dockerfile"
        DESTINATION_BRANCH: "${IMAGE_BRANCH}"
        DESTINATION_VERSION: "${IMAGE_REPO}:${RELEASE_VERSION}"
        DESTINATION_LATEST: "${IMAGE_REPO}:latest"
    needs:
        - ui-build
        - create-release
